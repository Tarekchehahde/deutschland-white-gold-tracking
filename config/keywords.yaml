# Filter für Rohstoff / Lithium / Batterie-Kette — konservativer als v0.
# Siehe METRICS.md; Pipeline: match_substrings ODER match_regex; Ausschluss via exclude_substrings.

exclude_substrings:
  - quecksilber
  - geburtshilfe
  - genossenschaftsbank
  - eichenprozessionsspinner
  - comic als urteil
  - ruhango-markt
  - second-hand
  - zu wenig geburten
  - stellenabbau

match_substrings:
  - lithium
  - lithium-ion
  - kritische rohstoffe
  - bodenschätze
  - feststoffbatterie
  - elektromobilität
  - elektroauto
  - geotherm
  - thermalwasser
  - tiefenwasser
  - brine
  - direkte lithiumextraktion
  - extraktion lithium
  - zinnwald
  - vulcan energy
  - vulcan energy resources
  - vulcan
  - neptune energy
  - CRM-act
  - critical raw materials
  - batteriezelle
  - akkuzelle
  - direktextraktion
  - lithium-ionen
  - batteriefabrik
  - akkufabrik
  - gigafactory
  - kathodenmaterial
  - nickelsulfat
  # Geologie / Rohstoffkörper (z. B. Thermalsole, Pegmatit, „Taschen“ in Berichten)
  - pegmatit
  - spodumen
  - salzlauge
  - tiefengeothermie
  - mineralische rohstoffe
  - lithiumgewinnung
  - lithium-ion-batterie

# Zusätzliche Muster (Python re.IGNORECASE). Für Kontext „Lithium/Batterie/Speicher“ ohne False Positives wie „Stellenabbau“.
match_regex:
  - '(?i)(strom|akkus|batterie|energie)(speicher|speicherung)'
  - '(?i)lithium.{0,75}(batterie|gewinnung|mine|vorkommen|lagerstätte|lagerstätten|ressource|reservoir|tasche|taschen|pocket|pockets|projekt|fabrik|werk|sole|brüne|salzlauge)'
  - '(?i)(lagerstätte|lagerstätten|rohstoffvorkommen).{0,75}lithium'
  - '(?i)(lithium.{0,30}(pegmatit|spodumen))'
  - '(?i)((pegmatit|spodumen).{0,55}lithium)'
  - '(?i)(?:salz)?sole.{0,50}(lithium|gewinnung|extraktion|geotherm|thermal)'
  - '(?i)(salzlauge|thermalsole).{0,50}(lithium|gewinnung|extraktion|geotherm)'
  - '(?i)reservoir.{0,55}(lithium|geotherm|thermal|thermalwasser|sole|brüne)'
  - '(?i)(batterie|akkuzelle|hochvolt).{0,45}lithium'
  - '(?i)(strategische|kritische)\s+rohstoffe'
  - '(?i)rohstoff(e)?(strategie|sicherung|abkommen)'
  - '(?i)(oberrheingraben|oberrhein).{0,80}(lithium|geotherm|brine|thermalwasser)'
  - '(?i)(altmark|salzwedel).{0,80}(lithium|gasfeld|erdgas|brine|thermal|neptune|extraktion)'
  - '(?i)(erzgebirge|zinnwald).{0,80}(lithium|zinnwald|\bzinn\b|exploration|aufsuchung)'
  - '(?i)bergbau.{0,60}(lithium|kobalt|nickel|rohstoff|akk|batterie|zinnwald)'
  - '(?i)(lithium|kobalt|nickel).{0,60}bergbau'
  - '(?i)wismut.{0,90}(lithium|zinnwald|akk|batterie|rohstoff)'
  - '(?i)batterie.{0,45}(fabrik|werk|produktion|zelle)'
  - '(?i)(akkuzellen?|hochvoltbatterie).{0,35}(werk|fabrik|standort)'
  - '(?i)\blandau\b.{0,65}(lithium|geotherm|thermal|vulcan|sole|speicher|akk|batterie|rohstoff)'
  - '(?i)\bvulcan\b.{0,55}(landau|oberrhein|lithium|pfalz|geotherm|thermal)'

