# Filter für Rohstoff / Lithium / Batterie-Kette — konservativer als v0.
# Siehe METRICS.md; Pipeline: match_substrings ODER match_regex; Ausschluss via exclude_substrings.

exclude_substrings:
  - quecksilber
  - geburtshilfe
  - genossenschaftsbank
  - eichenprozessionsspinner
  - comic als urteil
  - ruhango-markt
  - second-hand
  - zu wenig geburten
  - stellenabbau

match_substrings:
  - lithium
  - lithium-ion
  - kritische rohstoffe
  - bodenschätze
  - feststoffbatterie
  - elektromobilität
  - elektroauto
  - e-auto
  - geotherm
  - thermalwasser
  - tiefenwasser
  - brine
  - direkte lithiumextraktion
  - extraktion lithium
  - zinnwald
  - vulcan energy
  - vulcan energy resources
  - neptune energy
  - CRM-act
  - critical raw materials
  - wismut
  - bergbau
  - batteriezelle
  - akkuzelle
  - direktextraktion

# Zusätzliche Muster (Python re.IGNORECASE). Für Kontext „Lithium/Batterie/Speicher“ ohne False Positives wie „Stellenabbau“.
match_regex:
  - '(?i)(strom|akkus|batterie|energie)(speicher|speicherung)'
  - '(?i)lithium.{0,55}(batterie|gewinnung|mine|vorkommen|lager|projekt|fabrik|werk)'
  - '(?i)(batterie|akkuzelle|hochvolt).{0,45}lithium'
  - '(?i)(strategische|kritische)\s+rohstoffe'
  - '(?i)rohstoff(e)?(strategie|sicherung|abkommen)'
  - '(?i)(oberrheingraben|oberrhein).{0,80}(lithium|geotherm|brine|thermalwasser)'
  - '(?i)(altmark|salzwedel).{0,80}(lithium|gasfeld|erdgas|brine|thermal|neptune|extraktion)'
  - '(?i)(erzgebirge|zinnwald).{0,80}(lithium|bergbau|zinn|wismut|abbau|exploration)'

tag_rules:
  politik:
    substrings:
      - regierung
      - ministerium
      - minister
      - eu-kommission
      - europäische kommission
      - bundestag
      - landtag
      - genehmigung
      - aufsicht
  umwelt:
    substrings:
      - umwelt
      - naturschutz
      - grundwasser
      - wasserrecht
      - protest
      - bürgerinitiative
      - klima
  exploration:
    substrings:
      - exploration
      - bohrung
      - erkundung
      - lizenz
      - aufsuchung
      - probe
  industrie:
    substrings:
      - unternehmen
      - lieferkette
      - fabrik
      - raffinerie
      - chemie

region_hints:
  - substring: altmark
    code: DE-ST
  - substring: salzwedel
    code: DE-ST
  - substring: magdeburg
    code: DE-ST
  - substring: sachsen-anhalt
    code: DE-ST
  - substring: zinnwald
    code: DE-SN
  - substring: erzgebirge
    code: DE-SN
  - substring: chemnitz
    code: DE-SN
  - substring: leipzig
    code: DE-SN
  - substring: oberrhein
    code: DE-RP
  - substring: rheinland-pfalz
    code: DE-RP
  - substring: landau
    code: DE-RP
  - substring: baden-württemberg
