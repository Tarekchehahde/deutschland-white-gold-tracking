name: Ingest RSS and publish Pages

on:
  workflow_dispatch:
    inputs:
      run_epoch_merge:
        description: "Vor regulärem Ingest Epochen-Zug ab epoch_since ins Archiv mergen (RSS nur letzte N Items/Feed)."
        type: boolean
        default: false
      epoch_since:
        description: "Untere Datumsgrenze YYYY-MM-DD (UTC) für Epochen-Schritt"
        type: string
        default: "2025-01-01"
      max_entries_per_feed:
        description: "Max. RSS-Einträge pro Feed im Epochen-Schritt"
        type: string
        default: "400"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "config/**"
      - "dashboard/**"
      - "data/fixtures/demo/**"
      - "pipeline/archive_merge.py"
      - "data/archive/**"
      - ".github/workflows/ingest-and-pages.yml"
  schedule:
    # ~07:00 / ~20:00 mitteleuropäische Zeit (Sommer CEST ≈ UTC+2 → 05:00 / 18:00 UTC).
    # Winter weicht ab — bei Bedarf zweimal jährlich anpassen.
    - cron: "15 5 * * *"
    - cron: "15 18 * * *"

permissions:
  contents: write

concurrency:
  group: deutschland-white-gold-pages
  cancel-in-progress: true

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Epoch ingest into archive (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_epoch_merge == 'true' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp_epoch_out
          python pipeline/run.py \
            --output-dir tmp_epoch_out \
            --since-date "${{ github.event.inputs.epoch_since }}" \
            --max-entries-per-feed "${{ github.event.inputs.max_entries_per_feed }}"
          python pipeline/archive_merge.py \
            --recent-json tmp_epoch_out/articles_recent.json \
            --archive-dir data/archive

      - name: Run ingest
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p site/data/fixtures
          python pipeline/run.py --output-dir site/data/fixtures --window-days 7

      - name: Merge rolling window into archive
        run: |
          python pipeline/archive_merge.py \
            --recent-json site/data/fixtures/articles_recent.json \
            --archive-dir data/archive

      - name: Assemble static site
        run: |
          mkdir -p site/data/fixtures site/data/archive
          cp dashboard/index.html dashboard/app.js dashboard/styles.css dashboard/historie.html dashboard/historie.js site/
          touch site/.nojekyll
          if [ -d data/fixtures/demo ]; then mkdir -p site/data/fixtures && cp -r data/fixtures/demo site/data/fixtures/; fi
          cp data/archive/archive.json data/archive/summary.json site/data/archive/
          rm -rf site/data/archive/months
          cp -r data/archive/months site/data/archive/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: false

      - name: Commit archive to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/
          if git diff --staged --quiet; then
            echo "No archive changes."
          else
            git commit -m "chore(archive): update from ingest [skip ci]"
            git push
          fi
